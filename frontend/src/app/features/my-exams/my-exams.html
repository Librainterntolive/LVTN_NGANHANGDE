<h2>Đề thi của tôi</h2>

@if (error()) { <p style="color:red">{{ error() }}</p> }

<div style="display:flex; flex-wrap:wrap; gap:16px; margin-top:12px;">
  @for (e of exams(); track e.id) {
    <div class="exam-card">
      <div style="font-size:var(--fs-3xl);"><app-icon name="file-text" /></div>
      <h3 style="margin:8px 0 4px; color:var(--accent);">{{ e.title }}</h3>
      <p style="color:var(--text-2); font-size:var(--fs-sm); flex:1;">
        ⏱ {{ e.duration }} phút &nbsp;•&nbsp; Đậu từ {{ e.pass_score }}đ
      </p>
      <a [routerLink]="['/take', e.id]" class="take-btn">Vào thi</a>
    </div>
  } @empty {
    <p>Hiện chưa có đề thi nào được giao cho bạn.</p>
  }
</div>

<app-paginator
  [total]="total()"
  [page]="page()"
  [limit]="limit()"
  (pageChange)="goToPage($event)"
  (limitChange)="setLimit($event)" />

<style>
  .exam-card {
    background:var(--surface); border-radius:var(--r-md); padding:20px; width:240px;
    display:flex; flex-direction:column;
    box-shadow:var(--shadow); transition:transform .15s, box-shadow .15s;
  }
  .exam-card:hover { transform:translateY(-3px); box-shadow:var(--shadow); }
  .take-btn {
    display:inline-block; text-align:center; padding:9px;
    background:var(--accent); color:#fff; border-radius:var(--r-sm); text-decoration:none; font-weight:600;
  }
  .take-btn:hover { background:var(--accent-hover); text-decoration:none; }
  .load-more { text-align:center; margin:22px 0; }
</style>
