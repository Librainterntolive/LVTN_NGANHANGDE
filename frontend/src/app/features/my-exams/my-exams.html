<h2>Đề thi của tôi</h2>

@if (error()) { <p style="color:red">{{ error() }}</p> }

<div style="display:flex; flex-wrap:wrap; gap:16px; margin-top:12px;">
  @for (e of exams(); track e.id) {
    <div class="exam-card">
      <div style="font-size:30px;">📝</div>
      <h3 style="margin:8px 0 4px; color:var(--accent);">{{ e.title }}</h3>
      <p style="color:var(--text-2); font-size:13px; flex:1;">
        ⏱ {{ e.duration }} phút &nbsp;•&nbsp; Đậu từ {{ e.pass_score }}đ
      </p>
      <a [routerLink]="['/take', e.id]" class="take-btn">Vào thi</a>
    </div>
  } @empty {
    <p>Hiện chưa có đề thi nào được giao cho bạn.</p>
  }
</div>

@if (hasMore()) { <div class="load-more"><button class="btn-outline" (click)="load(false)" [disabled]="loading()">{{ loading() ? 'Đang tải…' : 'Tải thêm đề thi' }}</button><div appInfiniteScroll (scrolled)="load(false)" style="height:1px;"></div></div> }

<style>
  .exam-card {
    background:var(--surface); border-radius:10px; padding:20px; width:240px;
    display:flex; flex-direction:column;
    box-shadow:0 2px 8px rgba(0,0,0,.08); transition:transform .15s, box-shadow .15s;
  }
  .exam-card:hover { transform:translateY(-3px); box-shadow:0 6px 16px rgba(0,0,0,.12); }
  .take-btn {
    display:inline-block; text-align:center; padding:9px;
    background:var(--accent); color:#fff; border-radius:6px; text-decoration:none; font-weight:600;
  }
  .take-btn:hover { background:var(--accent-hover); text-decoration:none; }
  .load-more { text-align:center; margin:22px 0; }
</style>
