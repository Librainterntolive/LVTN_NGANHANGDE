<div class="auth-card">
  <h2 style="margin:0 0 4px;">Đăng ký</h2>
  <p style="color:var(--text-3); font-size:13px; margin:0 0 18px;">
    Tài khoản đăng ký tại đây là tài khoản <b>Sinh viên</b>.
  </p>

  @if (ok()) {
    <p class="auth-ok" role="status">✅ Đăng ký thành công! Đang chuyển sang trang đăng nhập...</p>
  }
  @if (error()) {
    <p class="auth-error" role="alert">⛔ {{ error() }}</p>
  }

  <form (ngSubmit)="submit()">
    <div class="fld">
      <label for="rg-user">Tên đăng nhập <span class="req">*</span></label>
      <input id="rg-user" name="username" [(ngModel)]="form.username" autocomplete="username"
             placeholder="VD: sv02" [disabled]="loading() || ok()" />
    </div>

    <div class="fld">
      <label for="rg-name">Họ tên <span class="req">*</span></label>
      <input id="rg-name" name="full_name" [(ngModel)]="form.full_name" autocomplete="name"
             placeholder="VD: Nguyễn Văn A" [disabled]="loading() || ok()" />
    </div>

    <div class="fld">
      <label for="rg-mail">Email <small style="color:var(--text-3);">(không bắt buộc)</small></label>
      <input id="rg-mail" name="email" type="email" [(ngModel)]="form.email" autocomplete="email"
             placeholder="VD: sv02@truong.edu.vn" [disabled]="loading() || ok()" />
    </div>

    <div class="fld">
      <label for="rg-pass">Mật khẩu <span class="req">*</span></label>
      <input id="rg-pass" name="password" type="password" [(ngModel)]="form.password"
             autocomplete="new-password" placeholder="Ít nhất 6 ký tự" [disabled]="loading() || ok()" />
    </div>

    <button type="submit" class="auth-btn" [disabled]="loading() || ok()">
      {{ loading() ? 'Đang đăng ký...' : 'Đăng ký' }}
    </button>
  </form>

  <p style="margin:16px 0 0; font-size:14px; text-align:center;">
    Đã có tài khoản? <a routerLink="/login">Đăng nhập</a>
  </p>
</div>
