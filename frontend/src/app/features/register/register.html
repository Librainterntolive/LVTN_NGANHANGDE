<div style="max-width:340px; margin:40px auto; padding:24px; border:1px solid var(--border); border-radius:8px;">
  <h2>Đăng ký (Sinh viên)</h2>

  @if (ok()) {
    <p style="color:green">Đăng ký thành công! Đang chuyển sang đăng nhập...</p>
  }
  @if (error()) { <p style="color:red">{{ error() }}</p> }

  <div style="margin-bottom:10px;"><input [(ngModel)]="form.username" placeholder="Tên đăng nhập" style="width:100%; padding:8px;" /></div>
  <div style="margin-bottom:10px;"><input [(ngModel)]="form.full_name" placeholder="Họ tên" style="width:100%; padding:8px;" /></div>
  <div style="margin-bottom:10px;"><input [(ngModel)]="form.email" placeholder="Email" style="width:100%; padding:8px;" /></div>
  <div style="margin-bottom:10px;"><input [(ngModel)]="form.password" type="password" placeholder="Mật khẩu" style="width:100%; padding:8px;" /></div>
  <button (click)="submit()" style="width:100%; padding:10px; background:var(--accent); color:#fff; border:none; border-radius:4px;">Đăng ký</button>
</div>
