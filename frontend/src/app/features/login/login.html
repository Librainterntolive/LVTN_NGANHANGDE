<div class="auth-card">
  <h2 style="margin:0 0 4px;">Đăng nhập</h2>
  <p style="color:var(--text-3); font-size:13px; margin:0 0 18px;">
    Đăng nhập để làm bài thi và quản lý ngân hàng đề.
  </p>

  @if (error()) {
    <p class="auth-error" role="alert">⛔ {{ error() }}</p>
  }

  <!-- form: cho phép nhấn Enter ở bất kỳ ô nào để đăng nhập -->
  <form (ngSubmit)="submit()">
    <div class="fld">
      <label for="lg-user">Tên đăng nhập</label>
      <input id="lg-user" name="username" [(ngModel)]="username" autocomplete="username"
             placeholder="VD: sv01" [disabled]="loading()" />
    </div>

    <div class="fld">
      <label for="lg-pass">Mật khẩu</label>
      <input id="lg-pass" name="password" type="password" [(ngModel)]="password"
             autocomplete="current-password" placeholder="Nhập mật khẩu" [disabled]="loading()" />
    </div>

    <button type="submit" class="auth-btn" [disabled]="loading()">
      {{ loading() ? 'Đang đăng nhập...' : 'Đăng nhập' }}
    </button>
  </form>

  <p style="margin:16px 0 0; font-size:14px; text-align:center;">
    Chưa có tài khoản? <a routerLink="/register">Đăng ký ngay</a>
  </p>

  <p class="auth-hint">
    Tài khoản thử: <b>admin</b> / <b>admin123</b>
  </p>
</div>
