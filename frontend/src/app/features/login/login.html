<section class="auth-card">
  <p class="eyebrow">NGÂN HÀNG ĐỀ THI ĐẠI HỌC</p><h2>Đăng nhập</h2>
  <p class="auth-note">Đăng nhập để quản lý lớp, bài tập, đề thi và kết quả học tập.</p>
  @if (error()) { <p class="auth-error">{{ error() }}</p> }
  <form (ngSubmit)="submit()">
    <div class="fld"><label>Tên đăng nhập</label><input name="username" [(ngModel)]="username" autocomplete="username" placeholder="Ví dụ: sv_nguyenvana" [disabled]="loading()" /></div>
    <div class="fld"><label>Mật khẩu</label><input name="password" type="password" [(ngModel)]="password" autocomplete="current-password" placeholder="Nhập mật khẩu" [disabled]="loading()" /></div>
    <button type="submit" class="auth-btn" [disabled]="loading()">{{ loading() ? 'Đang đăng nhập...' : 'Đăng nhập' }}</button>
  </form>
  <p class="auth-links"><a routerLink="/forgot-password">Quên mật khẩu?</a><a routerLink="/register">Tạo tài khoản sinh viên</a></p>
</section>
